name=CC310
version=0.0.1
author=NiusRobotLab
maintainer=dunknowcoding
sentence=Compatibility shim: ArduinoNRF's CryptoCell 310 support now lives in the NiusCrypto library.
paragraph=Keeps `#include <NrfCC310.h>` working for existing sketches by forwarding to the NiusCrypto library (https://github.com/dunknowcoding/ArduinoNRF-Crypto), which vendors Nordic's CRYS runtime for SHA/AES/ECC/TRNG on the CC310 hardware plus Oberon for AES-GCM. Requires the NiusCrypto library (`depends=NiusCrypto`). Without it the sketch fails to compile, like libraries/Thread/ without NiusThread.
category=Other
url=https://github.com/dunknowcoding/ArduinoNRF-Crypto
architectures=nrf52
includes=NrfCC310.h
depends=NiusCrypto
