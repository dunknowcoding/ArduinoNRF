sentence=Compatibility shim: ArduinoNRF's CryptoCell 310 support now lives in the NiusCrypto library.
paragraph=Keeps `#include <NrfCC310.h>` working for existing sketches by forwarding to the NiusCrypto library (https://github.com/dunknowcoding/ArduinoNRF-Crypto), which vendors Nordic's CRYS runtime for SHA/AES/ECC/TRNG on the CC310 hardware plus Oberon for AES-GCM. Install NiusCrypto from GitHub; without it this shim compiles but every operation returns CC310_NOT_VENDORED. See vendor/README.md for the legacy in-package vendoring notes.
