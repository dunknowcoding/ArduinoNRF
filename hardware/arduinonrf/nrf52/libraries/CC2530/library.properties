sentence=Drive a TI CC2530 module as an IEEE 802.15.4 radio co-processor over UART.
paragraph=Adds a second, independent 2.4GHz 802.15.4 radio to an ArduinoNRF board via an external CC2530 module running the bundled SDCC "cc2530_radio" firmware. Simple API: begin/ping/setChannel/setPromiscuous/send/onReceive/poll. Works on clone CC2530 modules that cannot run stock TI Z-Stack. Firmware source + prebuilt image + a board-as-programmer flasher (no CC-Debugger needed) are in extras/firmware/.
