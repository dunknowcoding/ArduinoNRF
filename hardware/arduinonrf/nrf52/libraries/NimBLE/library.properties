sentence=Full BLE 5 host + controller via Apache Mynewt's NimBLE stack on the nRF52840 RADIO
paragraph=M1 library slice. begin() now initializes the bare-metal porting layer, requests HFCLK, and exposes the chip BLE address on hardware. startAdvertising() currently only bridges into the repository's in-tree advertising facade, whose radio backend is still a stub rather than a proven over-the-air controller. Full NimBLE host/controller, connections, and GATT still require further vendoring and integration work - see vendor/README.md and docs/platform/NIMBLE_INTEGRATION_PLAN.md.
