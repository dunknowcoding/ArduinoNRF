name=CCDebugger
version=1.0.0
author=dunknowcoding (NiusRobotLab)
maintainer=dunknowcoding
sentence=Built-in TI CC2530/CC253x debugger & flasher for ArduinoNRF - program Zigbee chips with no external CC-Debugger.
paragraph=Bit-bangs the CC2530 two-wire debug interface on three GPIOs and programs flash through the chip's own DMA engine (read-back verified). Flash firmware (this project's SDCC transceiver, or a TI Z-Stack image) onto a CC2530 module, which the ArduinoNRF-Zigbee library then drives over UART. Wiring: DD/DC/RST to any GPIOs; CC2530 at 3.3 V.
category=Communication
url=https://github.com/dunknowcoding/ArduinoNRF
architectures=nrf52
includes=CCDebugger.h
