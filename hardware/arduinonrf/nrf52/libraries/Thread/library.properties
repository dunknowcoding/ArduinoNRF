sentence=Compatibility shim: ArduinoNRF's Thread (OpenThread) support now lives in the NiusThread library.
paragraph=Keeps `#include <Thread.h>` working for existing sketches by forwarding to the NiusThread library (https://github.com/dunknowcoding/ArduinoNRF-Thread), which vendors the full OpenThread FTD stack on the nRF52840's native radio. Install NiusThread from the Library Manager or GitHub; without it this shim raises a clear compile-time error.
