paragraph=Full OpenThread FTD vendored (openthread fa3213ec + mbedtls 3.6.5) on a register-level IEEE 802.15.4 driver. Single-node network formation hardware-verified (Leader role, MLE advertisements confirmed over the air by an independent CC2530 sniffer). Uses RADIO (exclusive with NimBLE/Zigbee), RTC2 and TIMER3. Call Thread.process() from loop().
